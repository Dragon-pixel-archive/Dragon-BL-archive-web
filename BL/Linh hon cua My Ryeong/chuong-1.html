<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đọc Truyện Online</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px
        }

        .hero {
            background: linear-gradient(135deg, rgba(139, 92, 246, .18), rgba(34, 197, 94, .10));
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 26px;
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .topbar {
            display: flex;
            gap: 12px;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
        }


        .manga-container {
            width: 100%;
            max-width: 800px;
            line-height: 0;
        }

        .manga-container img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
            border: none;
        }

        .sub {
            margin: 8px 0 0;
            color: var(--muted);
            line-height: 1.6
        }

        .home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: var(--chip);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 11px 14px;
            font-weight: 700;
            transition: .15s ease;
            white-space: nowrap;
        }

        img {
            transition: opacity 0.1s;
        }
    </style>
</head>
