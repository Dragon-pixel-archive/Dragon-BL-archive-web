<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linh hồn của My Ryeong</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1e2330;
      --text: #f3f5fb;
      --muted: #aab3c5;
      --accent: #8b5cf6;
      --line: #2a3142;
      --chip: #232938;
      --shadow: 0 10px 30px rgba(0, 0, 0, .25);
      --radius: 18px;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(139, 92, 246, .18), transparent 30%),
        radial-gradient(circle at top right, rgba(34, 197, 94, .08), transparent 25%),
        var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px
    }

    .hero {
      background: linear-gradient(135deg, rgba(139, 92, 246, .18), rgba(34, 197, 94, .10));
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 26px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .topbar {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 3.5vw, 2.8rem)
    }

    .sub {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.6
    }

    .home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: var(--chip);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 11px 14px;
      font-weight: 700;
      transition: .15s ease;
      white-space: nowrap;
    }

    .home:hover {
      transform: translateY(-1px);
      border-color: rgba(139, 92, 246, .5)
    }

    .section {
      margin-top: 22px;
      background: rgba(23, 26, 33, .82);
      border: 1px solid rgba(255, 255, 255, .07);
      border-radius: 26px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-head {
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .meta {
      color: var(--muted)
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 18px;
    }

    @media (min-width:760px) {
      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width:560px) {
      .grid {
        grid-template-columns: 1fr
      }
    }

    .chapter {
      display: block;
      text-decoration: none;
      color: var(--text);
      background: linear-gradient(180deg, rgba(255, 255, 255, .03), rgba(255, 255, 255, .01));
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      transition: .18s ease;
      min-height: 1px;
    }

    .chapter:hover {
      transform: translateY(-2px);
      border-color: rgba(139, 92, 246, .55);
    }

    .chapter .title {
      display: block;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 6px;
    }

    .chapter .path {
      display: block;
      color: var(--muted);
      font-size: .88rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pager {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 18px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, .015);
    }

    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      background: var(--chip);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 700;
      transition: .15s ease;
      min-width: 44px;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: rgba(139, 92, 246, .45);
    }

    .btn.active {
      background: var(--accent);
      border-color: transparent;
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed;
      transform: none
    }

    .empty {
      padding: 28px 18px;
      color: var(--muted);
      text-align: center;
      display: none;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="hero">
      <div class="topbar">
        <div>
          <h1 id="storyTitle">Linh hồn của My Ryeong</h1>
          <p class="sub">
            Câu chuyện tình yêu đáng yêu, ngọt ngào của hai pháp sư trừ tà trẻ tuổi.
          </p>
        </div>
        <a id="homeBtn" class="home" href="../index.html">← Quay lại trang chủ</a>
      </div>
    </div>

    <section class="section">
      <div class="section-head">
        <div>
          <strong>Danh sách chương</strong><br />
          <span id="pageInfo" class="meta">Trang 1</span>
        </div>
        <div class="meta">20 chương / trang</div>
      </div>

      <div id="chapterGrid" class="grid"></div>
      <div id="emptyState" class="empty">Chưa có chương nào.</div>
      <div id="pager" class="pager"></div>
    </section>
  </div>

  <script>
    const STORY_TITLE = "Linh hồn của My Ryeong";
    const HOME_PATH = "../index.html";
    const CHAPTER_BASE_PATH = "../BL/Linh hon cua My Ryeong/";
    const PAGE_SIZE = 20;

    const chapters = [
      { title: "Chương 1", file: "chuong-1.html" },
      { title: "Chương 2", file: "chuong-2.html" },
      { title: "Chương 3", file: "chuong-3.html" },
      { title: "Chương 4", file: "chuong-4.html" },
      { title: "Chương 5", file: "chuong-5.html" },
      { title: "Chương 6", file: "chuong-6.html" },
      { title: "Chương 7", file: "chuong-7.html" },
      { title: "Chương 8", file: "chuong-8.html" },
      { title: "Chương 9", file: "chuong-9.html" },
      { title: "Chương 10", file: "chuong-10.html" },
      { title: "Chương 11", file: "chuong-11.html" },
      { title: "Chương 12", file: "chuong-12.html" },
      { title: "Chương 13", file: "chuong-13.html" },
      { title: "Chương 14", file: "chuong-14.html" },
      { title: "Chương 15", file: "chuong-15.html" },
      { title: "Chương 16", file: "chuong-16.html" },
      { title: "Chương 17", file: "chuong-17.html" },
      { title: "Chương 18", file: "chuong-18.html" },
      { title: "Chương 19", file: "chuong-19.html" },
      { title: "Chương 20", file: "chuong-20.html" },
      { title: "Chương 21", file: "chuong-21.html" },
      { title: "Chương 22", file: "chuong-22.html" },
      { title: "Chương 23", file: "chuong-23.html" },
      { title: "Chương 24", file: "chuong-24.html" },
      { title: "Chương 25", file: "chuong-25.html" },
      { title: "Chương 26", file: "chuong-26.html" },
      { title: "Chương 27", file: "chuong-27.html" },
      { title: "Chương 28", file: "chuong-28.html" },
      { title: "Chương 29", file: "chuong-29.html" },
      { title: "Chương 30", file: "chuong-30.html" },
      { title: "Chương 31", file: "chuong-31.html" },
      { title: "Chương 32", file: "chuong-32.html" },
      { title: "Chương 33", file: "chuong-33.html" },
      { title: "Chương 34", file: "chuong-34.html" },
      { title: "Chương 35", file: "chuong-35.html" },
      { title: "Chương 36", file: "chuong-36.html" },
      { title: "Chương 37", file: "chuong-37.html" },
      { title: "Chương 38", file: "chuong-38.html" },
      { title: "Chương 39", file: "chuong-39.html" },
      { title: "Chương 40", file: "chuong-40.html" },
      { title: "Chương 41", file: "chuong-41.html" },
      { title: "Chương 42", file: "chuong-42.html" },
      { title: "Chương 43", file: "chuong-43.html" },
      { title: "Chương 44", file: "chuong-44.html" },
      { title: "Chương 45", file: "chuong-45.html" },
      { title: "Chương 46", file: "chuong-46.html" },
      { title: "Chương 47", file: "chuong-47.html" },
      { title: "Chương 48", file: "chuong-48.html" },
      { title: "Chương 49", file: "chuong-49.html" },
      { title: "Chương 50", file: "chuong-50.html" },
      { title: "Chương 51", file: "chuong-51.html" },
      { title: "Chương 52", file: "chuong-52.html" },
      { title: "Chương 53", file: "chuong-53.html" },
      { title: "Chương 54", file: "chuong-54.html" },
      { title: "Chương 55", file: "chuong-55.html" },
      { title: "Chương 56", file: "chuong-56.html" },
      { title: "Chương 57", file: "chuong-57.html" },
      { title: "Chương 58", file: "chuong-58.html" },
      { title: "Chương 59", file: "chuong-59.html" },
      { title: "Chương 60", file: "chuong-60.html" }
    ];

    const chapterGrid = document.getElementById('chapterGrid');
    const pager = document.getElementById('pager');
    const pageInfo = document.getElementById('pageInfo');
    const emptyState = document.getElementById('emptyState');
    const storyTitle = document.getElementById('storyTitle');
    const homeBtn = document.getElementById('homeBtn');

    storyTitle.textContent = STORY_TITLE;
    document.title = STORY_TITLE;

    let currentPage = 1;
    const totalPages = Math.max(1, Math.ceil(chapters.length / PAGE_SIZE));

    function getTitle(item) {
      return typeof item === 'string' ? item : (item.title || '');
    }

    function getFile(item) {
      if (typeof item === 'string') return slugify(item) + '.html';
      return item.file || (slugify(item.title || '') + '.html');
    }

    function slugify(str) {
      return String(str || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd')
        .replace(/[^a-z0-9\s-]/g, '')
        .trim()
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '') || 'untitled';
    }

    function render() {
      const start = (currentPage - 1) * PAGE_SIZE;
      const pageItems = chapters.slice(start, start + PAGE_SIZE);

      chapterGrid.innerHTML = '';
      emptyState.style.display = pageItems.length ? 'none' : 'block';
      pageInfo.textContent = `Trang ${currentPage} / ${totalPages}`;

      pageItems.forEach(item => {
        const title = getTitle(item);
        const file = getFile(item);
        const a = document.createElement('a');
        a.className = 'chapter';
        a.href = CHAPTER_BASE_PATH + file;
        a.innerHTML = `
          <span class="title">${escapeHtml(title)}</span>
        `;
        chapterGrid.appendChild(a);
      });

      pager.innerHTML = '';

      const makeBtn = (label, disabled, onClick, active = false) => {
        const btn = document.createElement('button');
        btn.className = 'btn' + (active ? ' active' : '');
        btn.textContent = label;
        btn.disabled = disabled;
        btn.addEventListener('click', onClick);
        return btn;
      };

      pager.appendChild(makeBtn('«', currentPage === 1, () => { currentPage = 1; render(); }));
      pager.appendChild(makeBtn('‹', currentPage === 1, () => { currentPage--; render(); }));

      const windowSize = 5;
      let startPage = Math.max(1, currentPage - Math.floor(windowSize / 2));
      let endPage = Math.min(totalPages, startPage + windowSize - 1);
      startPage = Math.max(1, endPage - windowSize + 1);

      for (let p = startPage; p <= endPage; p++) {
        pager.appendChild(makeBtn(String(p), false, () => { currentPage = p; render(); }, p === currentPage));
      }

      pager.appendChild(makeBtn('›', currentPage === totalPages, () => { currentPage++; render(); }));
      pager.appendChild(makeBtn('»', currentPage === totalPages, () => { currentPage = totalPages; render(); }));
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    homeBtn.href = HOME_PATH;
    render();
  </script>
</body>

</html>
