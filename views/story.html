<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background: #08111f;
            color: #fff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family:
                system-ui,
                -apple-system,
                Segoe UI,
                Roboto,
                Arial,
                sans-serif;

        }

        .header {
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            background: #0d1726;
            border-bottom: 1px solid rgba(255, 255, 255, .08);
            box-shadow: 0 3px 15px rgba(0, 0, 0, .3);
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .logo img {
            height: 48px;
            width: auto;
            border-radius: 50px;
            object-fit: cover;
            border: 2px solid lightblue;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .2);
        }

        .menu {
            font-size: 16px;
            padding: 10px;
            display: flex;
            gap: 20px;
        }

        .menu a {
            text-decoration: none;
            color: #d8dce7;
            padding: 10px 18px;
            border-radius: 10px;
            transition: .3s;
            background: transparent;
        }

        .menu a:hover {
            background: #1c2a40;
            color: white;
        }

        .header-right {
            display: flex;
            align-items: center;
            flex: 1;
            justify-content: flex-end;
            gap: 20px;
        }

        .search {
            width: clamp(100px, 35vw, 500px);
            margin: 0 20px;
            display: flex;
        }

        .search-input::placeholder {
            color: #9097a7;
        }

        .search-input {
            flex: 1;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 16px;
            color: #333;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 20px 0 0 20px;
            outline: none;
        }

        .search-input:focus {
            border-color: #4f46e5;
        }

        .search-btn {
            padding: 0 20px;
            font-size: 15px;
            background-color: white;
            color: black;
            border: 1px solid #ccc;
            border-radius: 0 20px 20px 0;
            border-left: none;
            cursor: pointer;
        }

        .bookmark,
        .account {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: #141d2d;
            color: white;
            cursor: pointer;
            transition: .3s;
        }

        .bookmark:hover,
        .account:hover {
            background: #253551;
        }

        .story-hero {
            height: 350px;
            background: rgb(27, 27, 27);
        }
    </style>

</head>

<body>
    <header class="header">

        <div class="header-left">

            <a href="/" class="logo">
                <img src="https://bwl3ugxlcpfaxorl.public.blob.vercel-storage.com/search-icon">
            </a>

            <nav class="menu">
                <a href="#">Home</a>
                <a href="#">Mới</a>
                <a href="#">Phổ biến</a>
            </nav>

        </div>

        <div class="header-right">

            <form class="search">
                <input class="search-input" type="text">
                <button class="search-btn">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>

            <button class="bookmark">
                <i class="fa-regular fa-bookmark"></i>
            </button>

            <button class="account">
                <i class="fa-regular fa-circle-user"></i>
            </button>

        </div>

    </header>
    <main class="container">
        <nav class="breadcrumb">
            <a href="/">Trang chủ</a>
            <span>/</span>
            <span>Chỉ riêng đuôi là không được</span>
        </nav>
        <section class="story-header">

            <div class="story-cover">

                <img class="cover" src="" alt="Cover">

                <div class="share-buttons">

                </div>

            </div>

            <div class="story-info">

                <h1>Chỉ riêng đuôi là không được!</h1>

                <div class="genres">
                    <a href="#">BL</a>
                    <a href="#">action</a>
                    <a href="#">comedy</a>
                </div>

                <p class="other-title">
                    Don't tourch my tail!
                </p>

                <ul class="story-meta">
                    <li>
                        <i class="fa-solid fa-user-group">
                            <span>Nhóm dịch: </span>
                        </i>
                    </li>
                    <li>
                        <i>
                            <span>
                                Tình trạng: Đang cập nhật
                            </span>
                        </i>
                    </li>
                    <li>
                        <i>
                            <span>
                                Cập nhật:
                            </span>
                        </i>
                    </li>
                    <li>
                        <i class="fa-regular fa-bookmark">
                            <span>
                                Lượt theo dõi:
                            </span>
                        </i>
                    </li>
                    <li>
                        <i class="fa-solid fa-eye">
                            <span>Lượt xem: 20000</span>
                        </i>
                    </li>
                </ul>

                <div class="story-actions">
                    <button class="btn btn-primary">
                        đọc từ đầu
                    </button>
                    <button class="btn btn-secondary">
                        Đọc chương mới nhất
                    </button>
                    <button class="btn btn-success">
                        Theo dõi
                    </button>
                    <button class="btn btn-danger">
                        Báo lỗi
                    </button>
                </div>

                <div class="description">
                    <h2>
                        Giới thiệu
                    </h2>
                    <p>
                        ...
                    </p>
                </div>

            </div>

        </section>
        <section class="chapter">
            <div class="chapter-title">
                Danh sách chương
            </div>
            <div class="chapter-box">

            </div>
        </section>
    </main>

    <section class="comment">Tính năng đang phát triển</section>
    <footer></footer>
</body>

</html>
